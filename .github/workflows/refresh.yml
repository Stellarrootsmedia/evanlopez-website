name: Refresh podcast, videos & show dates
on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~6 AM Austin
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 scripts/sync.py && python3 scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto-refresh episodes, clips and dates" && git push)
